<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta name="description" content="Log workouts, track progress and personal records. Works offline.">
  <title>FitLog</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1 id="page-title">Today</h1>
  </header>

  <main id="view" tabindex="-1"></main>

  <div id="rest" class="rest" hidden>
    <div class="rest-progress"><span id="rest-bar"></span></div>
    <div class="rest-row">
      <span class="rest-label">Rest</span>
      <strong id="rest-time">1:30</strong>
      <button class="btn small ghost" data-action="rest-add" data-sec="-15">−15s</button>
      <button class="btn small ghost" data-action="rest-add" data-sec="15">+15s</button>
      <button class="btn small" data-action="rest-skip">Skip</button>
    </div>
  </div>

  <nav class="tabbar" aria-label="Sections">
    <button data-tab="today"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 6.5v11M17.5 6.5v11M3 9v6M21 9v6M6.5 12h11"/></svg><span>Workout</span></button>
    <button data-tab="history"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>History</span></button>
    <button data-tab="progress"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20h18M6 16l4-5 3 3 5-7"/></svg><span>Progress</span></button>
    <button data-tab="body"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8.5 10a4 4 0 0 1 7 0M12 10l1.5-2"/></svg><span>Body</span></button>
    <button data-tab="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg><span>Settings</span></button>
  </nav>

  <div id="modal"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
